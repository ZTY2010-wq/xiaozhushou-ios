name: build-ipa

# 没有 Mac 也能出 IPA：推到 GitHub（私有仓库也行），Actions 用 macOS runner 编译，
# 跑完在 Artifacts 里下载 .ipa。
#
# 触发方式：push 到 main，或手动 Actions → build-ipa → Run workflow

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 选 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 装 xcodegen
        run: brew install xcodegen

      - name: 编译未签名 IPA
        run: |
          chmod +x build.sh
          ./build.sh unsigned

      - name: 收集产物
        run: |
          mkdir -p artifacts
          cp out/*.ipa artifacts/ 2>/dev/null || true
          ls -lh artifacts || true

      - name: 上传 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XiaoZhuShou-ipa
          path: artifacts/*.ipa
          if-no-files-found: error
          retention-days: 30
